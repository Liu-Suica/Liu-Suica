<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Terminal neón: whoami de Lui Suica">
  <defs>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#3d6bff"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="solclip"><circle cx="845" cy="205" r="62"/></clipPath>
  </defs>

  <rect width="1000" height="400" rx="18" fill="#0d1117"/>
  <rect x="10" y="10" width="980" height="380" rx="16" fill="#0b1426" stroke="url(#borde)" stroke-width="2"/>

  <!-- barra superior -->
  <circle cx="38" cy="38" r="6" fill="#ff5f8a"/>
  <circle cx="58" cy="38" r="6" fill="#ffd166"/>
  <circle cx="78" cy="38" r="6" fill="#00d4ff"/>
  <line x1="28" y1="64" x2="972" y2="64" stroke="#1d3a6b"/>

  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
    <text x="100" y="43" font-size="13" fill="#5b7aa8">liu-suica · profile shell · online</text>

    <!-- panel izquierdo -->
    <rect x="28" y="84" width="654" height="286" rx="10" fill="#0e1a33" stroke="#00d4ff" stroke-opacity=".6" stroke-width="1.5"/>

    <text x="50" y="122" font-size="18" font-weight="700" fill="#00d4ff" filter="url(#glow)">❯ whoami</text>
    <text x="50" y="154" font-size="16" fill="#e9fdff">lui_suica<tspan fill="#5b7aa8" dx="14">—</tspan><tspan fill="#7df9ff" dx="14" font-weight="700">Ing. de Sistemas e Informática</tspan></text>
    <line x1="50" y1="172" x2="660" y2="172" stroke="#1d3a6b"/>

    <text x="50" y="202" font-size="14" fill="#5b7aa8">context:</text>
    <text x="180" y="202" font-size="14" fill="#9fc6ff">UTP · Lima, Perú <tspan font-size="10" font-weight="700" fill="#7df9ff">PE</tspan></text>
    <text x="50" y="230" font-size="14" fill="#5b7aa8">mission:</text>
    <text x="180" y="230" font-size="14" fill="#7df9ff">crear apps útiles, bonitas y bien hechas</text>

    <text x="50" y="270" font-size="18" font-weight="700" fill="#00d4ff" filter="url(#glow)">❯ ls expertise/</text>
    <text x="50" y="300" font-size="13" fill="#7df9ff">web/</text>
    <text x="180" y="300" font-size="13" fill="#e9fdff">HTML · CSS · JS · React · Node.js · PHP</text>
    <text x="50" y="326" font-size="13" fill="#7df9ff">mobile/</text>
    <text x="180" y="326" font-size="13" fill="#e9fdff">Kotlin · Jetpack Compose · Android Studio</text>
    <text x="50" y="352" font-size="13" fill="#7df9ff">data/</text>
    <text x="180" y="352" font-size="13" fill="#e9fdff">MySQL · SQLite · PostgreSQL · MongoDB</text>

    <!-- panel derecho: neon runtime -->
    <rect x="702" y="84" width="270" height="286" rx="10" fill="#0e1a33" stroke="#00d4ff" stroke-opacity=".6" stroke-width="1.5"/>
    <text x="726" y="122" font-size="15" fill="#7df9ff">neon-city runtime</text>

    <circle cx="845" cy="205" r="70" fill="#00d4ff" opacity=".18" filter="url(#glow)"/>
    <g clip-path="url(#solclip)">
      <rect x="780" y="140" width="130" height="130" fill="url(#sol)"/>
      <g fill="#0e1a33">
        <rect x="780" y="212" width="130" height="5"/>
        <rect x="780" y="225" width="130" height="7"/>
        <rect x="780" y="240" width="130" height="9"/>
      </g>
    </g>

    <path d="M724 280 C760 262 790 262 822 278 S884 296 950 272" fill="none" stroke="#00d4ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M724 280 C760 262 790 262 822 278 S884 296 950 272;
                M724 274 C760 290 792 290 822 274 S886 258 950 280;
                M724 280 C760 262 790 262 822 278 S884 296 950 272"/>
    </path>
    <path d="M724 302 C764 284 798 288 830 302 S896 316 950 296" fill="none" stroke="#3d6bff" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M724 302 C764 284 798 288 830 302 S896 316 950 296;
                M724 296 C764 314 798 312 830 296 S896 286 950 304;
                M724 302 C764 284 798 288 830 302 S896 316 950 296"/>
    </path>

    <text x="726" y="352" font-size="12" fill="#5b7aa8">status: aprendiendo siempre</text>
  </g>
</svg>
